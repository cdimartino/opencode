name: Magneto typecheck canary
on:
  push:
    branches: [homelab-magneto-typecheck]
permissions:
  contents: read
jobs:
  typecheck:
    if: github.repository == 'cdimartino/opencode'
    runs-on: [self-hosted, Linux, X64, homelab-linux-x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - name: Typecheck serially in the two-vCPU guest
        run: |
          set -euo pipefail
          (
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              grep -E '^(MemAvailable|SwapFree):' /proc/meminfo
              cat /proc/pressure/memory
              sleep 30
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          bun turbo typecheck:tsc --concurrency=1
